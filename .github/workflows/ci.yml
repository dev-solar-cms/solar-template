# Created: 2026-09-25 05:39 CEST
# Role: Continuous integration workflow for the Solar Template theme.
# Author: David ROMERA <d.romera.11@gmail.com>
# Purpose: On every push/pull request, run the PHP and JS test suites (and the PHP coding
#          standard, and a production asset build) across the two PHP versions the theme claims
#          to support. On a successful push to `main`, automatically create a GitHub release for
#          the current `composer.json` version, unless that version was already released.

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHP coding standard
        run: composer lint

      - name: PHP unit tests
        run: composer test

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: JS unit tests
        run: npm run test

  release:
    name: Release
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read version from composer.json
        id: version
        run: echo "version=$(jq -r .version composer.json)" >> "$GITHUB_OUTPUT"

      - name: Check whether this version was already released
        id: tag
        run: |
          if git tag -l "v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract this version's notes from RELEASE.md
        if: steps.tag.outputs.exists == 'false'
        run: |
          awk -v ver="${{ steps.version.outputs.version }}" '
            $0 ~ "^### " ver { found=1; next }
            found && /^### / { exit }
            found { print }
          ' RELEASE.md > release_notes.md

      - name: Create release
        if: steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: release_notes.md
